<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Word Assistant</title>

    <script
        src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
        type="text/javascript">
    </script>
  <script type="module" crossorigin src="/assets/index-BmCTDG-K.js"></script>
</head>

<body>
    <h2>Word Assistant</h2>

    <label for="source-column">English source table column:</label>
    <select id="source-column">
      <option value="1">Column 1 (second cell)</option>
      <option value="2">Column 2 (third cell)</option>
      <option value="3">Column 3 (fourth cell)</option>
    </select>

    <label for="column-1-language">Column 1 language:</label>
    <select id="column-1-language">
      <option value="English">English</option>
      <option value="French">French</option>
      <option value="German">German</option>
    </select>

    <label for="column-2-language">Column 2 language:</label>
    <select id="column-2-language">
      <option value="English">English</option>
      <option value="French">French</option>
      <option value="German">German</option>
    </select>

    <label for="column-3-language">Column 3 language:</label>
    <select id="column-3-language">
      <option value="English">English</option>
      <option value="French">French</option>
      <option value="German">German</option>
    </select>

    <button id="save-source-column">
        Save language columns
    </button>

    <button id="translate-changed-paragraphs">
        Translate changed paragraphs
    </button>

    <button id="mark-revisions-seen">
        Mark current revisions as seen
    </button>

    <pre id="output">Waiting...</pre>

</body>
</html>
