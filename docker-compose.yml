services:

  frontend:
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile

    ports:
      - "3000:443"

    volumes:
      - ${OFFICE_CERTS_DIR:-/Users/octavian/.office-addin-dev-certs}:/certs:ro

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "https://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    init: true
    restart: unless-stopped
    build:
      context: ./backend

    env_file:
      - ./backend/.env.dev

    expose:
      - "8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
